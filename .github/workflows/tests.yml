# Automatische Tests bei jedem Push und Pull Request: Server/API, PDFs, Import, Sicherung, Desktop-Teile
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # wie im Home-Assistant-Container

      - name: Schrift wie im Container (Carlito)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito

      - name: Abhängigkeiten
        run: pip install -r rechnungen/requirements.txt pytest pypdfium2 zxing-cpp

      - name: Tests
        run: |
          pytest -v tests --junitxml=pytest.xml || {
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          ok = True
          for case in ET.parse("pytest.xml").iter("testcase"):
              for f in list(case.findall("failure")) + list(case.findall("error")):
                  ok = False
                  text = (f.get("message") or "") + " | " + (f.text or "").strip().splitlines()[-1][:300] if (f.text or "").strip() else (f.get("message") or "")
                  print(f"::error title={case.get('name')}::{text}")
          sys.exit(1)   # pytest ist fehlgeschlagen – Schritt immer rot
          PY
          }

      - name: JavaScript prüfen (Syntax)
        run: node --check rechnungen/app/static/app.js
