# Automatische Tests bei jedem Push und Pull Request: Server/API, PDFs, Import, Sicherung, Desktop-Teile
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"   # wie im Home-Assistant-Container

      - name: Schrift wie im Container (Carlito)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito

      - name: Abhängigkeiten
        run: pip install -r rechnungen/requirements.txt pytest pypdfium2 zxing-cpp

      - name: Tests
        run: |
          pytest -v tests --junitxml=pytest.xml || {
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          ok = True
          for case in ET.parse("pytest.xml").iter("testcase"):
              for f in list(case.findall("failure")) + list(case.findall("error")):
                  ok = False
                  text = (f.get("message") or "") + " | " + (f.text or "").strip().splitlines()[-1][:300] if (f.text or "").strip() else (f.get("message") or "")
                  print(f"::error title={case.get('name')}::{text}")
          sys.exit(1)   # pytest ist fehlgeschlagen – Schritt immer rot
          PY
          }

      - name: JavaScript prüfen (Syntax)
        run: for f in rechnungen/app/static/*.js; do node --check "$f"; done

  # Seit 1.15: Klick-Abläufe im Browser (Chrome und Safari/WebKit) mit Prüfung der Sicherheitsregeln (CSP, kein
  # eingeschleuster Code) – tests/browser, jede Suite mit eigenem Server und erfundenen Daten
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04   # fest: Playwright liefert Browser nur für bekannte Ubuntu-Versionen (ubuntu-latest = 26.04 geht noch nicht)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Schrift wie im Container (Carlito)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito
      - name: Abhängigkeiten und Browser
        run: |
          pip install -r rechnungen/requirements.txt pytest playwright==1.60.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser-Tests (${{ matrix.browser }})
        env:
          DJOS_BROWSERTESTS: "1"
          DJOS_BROWSER: ${{ matrix.browser }}
        run: pytest -v tests/browser

  # Das echte Add-on-Image für beide Architekturen von Home Assistant, mit 1 GB RAM wie auf kleinen Geräten
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image bauen
        run: docker build -t djos rechnungen && docker image ls djos
      - name: Texterkennung im Image (1 GB RAM, ohne Internet)
        run: |
          docker run -d --name djos --network none --memory 1g --memory-swap 1g --cpus 2 -v "$PWD/tests:/pruefung:ro" djos
          docker exec djos python3 /pruefung/ocr_rauchtest.py http://127.0.0.1:8099
          docker exec -e PYTHONDONTWRITEBYTECODE=1 djos python3 /pruefung/erechnung_rauchtest.py http://127.0.0.1:8099
          docker exec -e PYTHONDONTWRITEBYTECODE=1 djos python3 /pruefung/pdf_rauchtest.py http://127.0.0.1:8099
          docker exec -e PYTHONDONTWRITEBYTECODE=1 djos python3 /pruefung/dateien_rauchtest.py http://127.0.0.1:8099
          test "$(docker inspect -f '{{.State.OOMKilled}}' djos)" = false
          echo "Speicherspitze: $(( $(docker exec djos cat /sys/fs/cgroup/memory.peak) / 1048576 )) MB"
      - name: Protokoll
        if: always()
        run: docker logs djos 2>&1 | tail -40 || true
