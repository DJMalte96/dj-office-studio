# Baut DJ Office Studio als Desktop-App für Windows und macOS (ohne Home Assistant).
# - Bei Änderungen an App/Desktop-Code: Build + Kurztest, Ergebnis als Artefakt am Workflow-Lauf
# - Bei einem Tag „desktop-v…“: zusätzlich GitHub-Release mit den ZIP-Dateien zum Herunterladen
name: Desktop-App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["rechnungen/app/**", "rechnungen/config.yaml", "rechnungen/requirements.txt", "desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15
            name: macOS-AppleSilicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r rechnungen/requirements.txt -r desktop/requirements.txt pyinstaller pillow pytest

      - name: numpy für macOS 13 (pip nimmt sonst die Variante des Build-Rechners)
        if: runner.os == 'macOS'
        run: |
          NUMPY=$(grep '^numpy==' rechnungen/requirements.txt)
          pip download "$NUMPY" --no-deps --only-binary :all: --platform "macosx_13_0_$(uname -m)" -d "$RUNNER_TEMP/numpy"
          pip install --force-reinstall --no-deps "$RUNNER_TEMP"/numpy/*.whl

      - name: Tests
        run: |
          pytest -q tests --junitxml=pytest.xml || {
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          ok = True
          for case in ET.parse("pytest.xml").iter("testcase"):
              for f in list(case.findall("failure")) + list(case.findall("error")):
                  ok = False
                  text = (f.get("message") or "") + " | " + (f.text or "").strip().splitlines()[-1][:300] if (f.text or "").strip() else (f.get("message") or "")
                  print(f"::error title={case.get('name')}::{text}")
          sys.exit(1)   # pytest ist fehlgeschlagen – Schritt immer rot
          PY
          }

      - name: Version
        run: |
          echo "VERSION=$(grep '^version:' rechnungen/config.yaml | cut -d '"' -f 2)" >> "$GITHUB_ENV"

      - name: Bauen
        run: python desktop/build.py

      - name: Läuft ab macOS 13 (kein Programmteil darf mehr verlangen)
        if: runner.os == 'macOS'
        run: python desktop/mindest_macos.py "dist/DJ Office Studio.app" 13

      - name: Wie aus dem Internet geladen markieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # So sieht die App aus, wenn sie als ZIP heruntergeladen und mit Windows entpackt wurde
          Get-ChildItem -Recurse -File "dist/DJ Office Studio" | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $dll = Get-ChildItem -Recurse -File "dist/DJ Office Studio" -Filter Python.Runtime.dll | Select-Object -First 1
          Get-Content -LiteralPath $dll.FullName -Stream Zone.Identifier

      - name: Gegenprobe ohne Freigabe (Windows) – Fenster muss scheitern wie beim Nutzer
        if: runner.os == 'Windows'
        run: |
          export DJOS_TEST=1 DJOS_KEINE_FREIGABE=1 DJOS_BASIS="$RUNNER_TEMP/djos-gegenprobe"
          "dist/DJ Office Studio/DJ Office Studio.exe" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/absender && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/absender | grep '"fenster":false'
          cat "$DJOS_BASIS/Daten/protokoll.txt"
          taskkill //F //IM "DJ Office Studio.exe" || true
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/api/absender >/dev/null || break; sleep 1; done
          ! curl -sf http://127.0.0.1:8765/api/absender   # Port muss wieder frei sein

      - name: Kurztest (App starten, API und PDF prüfen)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="dist/DJ Office Studio/DJ Office Studio.exe"; else EXE="dist/DJ Office Studio.app/Contents/MacOS/DJ Office Studio"; fi
          export DJOS_TEST=1 DJOS_BASIS="$RUNNER_TEMP/djos-test"
          "$EXE" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/absender && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/absender | grep '"desktop":true'
          curl -sf http://127.0.0.1:8765/api/absender | grep '"fenster":true'   # App-Fenster (pywebview) ist im Paket lauffähig
          if [ "$RUNNER_OS" = "Windows" ]; then grep "Programmdateien freigegeben" "$DJOS_BASIS/Daten/protokoll.txt"; fi
          curl -sf -X PUT -H "X-DJOS: 1" -H "Content-Type: application/json" -d '{"name":"Test","iban":"DE00"}' http://127.0.0.1:8765/api/einstellungen > /dev/null
          curl -sf -X POST -H "X-DJOS: 1" -H "Content-Type: application/json" \
            -d '{"nummer":"001","datum":"2026-01-01","kunde":{"name":"Test","strasse":"Testweg 1","plz":"12345","ort":"Teststadt"},"zahlungsbedingung":"8 Tage","positionen":[{"beschreibung":"DJ","lieferdatum":"2026-01-01","preis":100}]}' \
            http://127.0.0.1:8765/api/rechnungen
          # erst in eine Datei laden: „curl | head“ bricht curl je nach Timing mit Schreibfehler (Exit 23) ab
          curl -sf -o "$RUNNER_TEMP/rechnung.pdf" http://127.0.0.1:8765/api/rechnungen/1/pdf
          head -c 5 "$RUNNER_TEMP/rechnung.pdf" | grep -q "%PDF"
          ls "$DJOS_BASIS/PDFs"
          # Echte Streckenberechnung über OpenStreetMap mit dem SSL der gebauten App (öffentliche Adressen).
          # Bei einer Störung des öffentlichen Dienstes nur Warnung, kein Abbruch.
          curl -sf -X PUT -H "X-DJOS: 1" -H "Content-Type: application/json" -d '{"kartendienst":true,"startadresse":"Rathausmarkt 1, 20095 Hamburg"}' http://127.0.0.1:8765/api/einstellungen > /dev/null
          STRECKE=$(curl -s -G --max-time 60 --data-urlencode "strasse=Marienplatz 1" --data-urlencode "plz=80331" --data "ort=M%C3%BCnchen" http://127.0.0.1:8765/api/fahrten/vorschau || true)
          echo "Strecke Hamburg → München: $STRECKE"
          if echo "$STRECKE" | grep -q '"km_einfach"'; then echo "Kartendienst ok"; else echo "::warning::Kartendienst nicht erreichbar: $STRECKE"; fi
          # Texterkennung in der gepackten App (eigener Prozess, Modelle, native Bibliotheken)
          python tests/ocr_rauchtest.py http://127.0.0.1:8765
          python tests/erechnung_rauchtest.py http://127.0.0.1:8765
          python tests/pdf_rauchtest.py http://127.0.0.1:8765
          python tests/dateien_rauchtest.py http://127.0.0.1:8765
          kill %1 || true

      - name: Packen (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/DJ Office Studio.app" "DJ-Office-Studio-${VERSION}-${{ matrix.name }}.zip"

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/DJ Office Studio" -DestinationPath "DJ-Office-Studio-$env:VERSION-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DJ-Office-Studio-${{ matrix.name }}
          path: DJ-Office-Studio-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: pakete
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: DJ Office Studio Desktop ${{ github.ref_name }}
          files: pakete/*.zip
          body: |
            DJ Office Studio für Windows und macOS – ohne Home Assistant.
            Installation und Hinweise: siehe README, Abschnitt „Ohne Home Assistant (Windows / Mac)“.
